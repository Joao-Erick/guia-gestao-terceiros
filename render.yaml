services:
  - type: web
    name: guia-gestao-terceiros
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_START
        value: "true"
